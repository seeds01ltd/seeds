version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: seed-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: seed_user
      POSTGRES_PASSWORD: seed_pass
      POSTGRES_DB: seed_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seed_user -d seed_db']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seed-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://seed_user:seed_pass@db:5432/seed_db?schema=public
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-secret-in-production}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
    volumes:
      - ./backend/prisma:/app/prisma

volumes:
  pgdata: